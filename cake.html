<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0910">
<meta name="description" content="一周年快乐 · 三层生日蛋糕，吹灭蜡烛许个愿。">
<title>一周年快乐 · 蛋糕</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#fff3ee;
    --muted:rgba(255,243,238,.66);
    --faint:rgba(255,243,238,.4);
    --rose:#ff6b9a;
    --rose-2:#ff9fc0;
    --rose-3:#ffb3c9;
    --gold:#ffd7a8;
    --champagne:#f3d7ad;
    --bg:#0a0910;
    --font-display:"Kaiti SC","STKaiti",KaiTi,"Songti SC",STSong,SimSun,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);line-height:1.5;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }

  /* ---------- 背景：近黑 + 暖色光晕 + 极细颗粒 ---------- */
  .bg{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(130% 100% at 50% 6%, #171022 0%, #100b17 40%, #0a0910 100%);
  }
  .bg::after{
    content:"";position:absolute;inset:-10%;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, rgba(0,0,0,0) 1px);
    background-size:3px 3px;opacity:.45;mix-blend-mode:screen;
  }
  .glow{
    position:absolute;left:50%;top:50%;border-radius:50%;
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
    animation:breathe 15s ease-in-out infinite;
  }
  .glow-a{
    top:40%;width:132vmin;height:132vmin;
    background:radial-gradient(circle, rgba(255,116,164,.20) 0%, rgba(255,150,120,.10) 38%, rgba(10,9,16,0) 68%);
  }
  .glow-b{
    top:62%;width:96vmin;height:96vmin;animation-delay:-7s;
    background:radial-gradient(circle, rgba(255,199,140,.13) 0%, rgba(10,9,16,0) 64%);
  }
  .glow-c{
    left:16%;top:22%;width:60vmin;height:60vmin;animation-delay:-11s;
    background:radial-gradient(circle, rgba(155,112,255,.11) 0%, rgba(10,9,16,0) 66%);
  }
  .glow-d{
    left:86%;top:74%;width:66vmin;height:66vmin;animation-delay:-3.5s;
    background:radial-gradient(circle, rgba(255,96,130,.10) 0%, rgba(10,9,16,0) 66%);
  }
  @keyframes breathe{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}
    50%{transform:translate(-50%,-50%) scale(1.09);opacity:1}
  }

  /* ---------- 3D 画布 ---------- */
  #scene{
    position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;
    touch-action:none;cursor:grab;background:transparent;
  }
  body.dragging #scene{cursor:grabbing}
  body.no3d #scene{display:none}

  /* ---------- 顶部文字 ---------- */
  .top{
    position:fixed;left:0;right:0;top:calc(22px + env(safe-area-inset-top));
    z-index:6;text-align:center;pointer-events:none;padding:0 22px;
    opacity:0;transition:opacity 1.6s ease .35s;
  }
  body.ready .top{opacity:1}
  .eyebrow{
    margin:0;font-size:10.5px;font-weight:500;letter-spacing:.42em;
    text-transform:uppercase;color:rgba(255,187,205,.78);padding-left:.42em;
  }
  .top-sub{
    margin:9px 0 0;font-size:11px;letter-spacing:.18em;
    color:var(--faint);padding-left:.18em;
  }

  /* ---------- 拖动提示 ---------- */
  .drag-hint{
    position:fixed;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom));
    z-index:6;text-align:center;pointer-events:none;
    font-size:11px;letter-spacing:.24em;color:rgba(255,243,238,.34);
    opacity:0;transition:opacity .8s ease;
  }
  body.ready .drag-hint{opacity:1}
  .drag-hint.gone,body.blown .drag-hint{opacity:0}
  body.no3d .dock{display:none}

  /* ---------- 底部「吹蜡烛」 ---------- */
  .dock{
    position:fixed;left:50%;z-index:20;
    bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translate(-50%,0);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    transition:opacity .55s ease,transform .55s ease,visibility .55s;
  }
  body.blown .dock,body.revealed .dock{opacity:0;visibility:hidden;transform:translate(-50%,16px);pointer-events:none}
  .btn-blow{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:16px 44px;border:0;border-radius:999px;cursor:pointer;
    font-family:var(--font-body);font-size:15.5px;font-weight:600;letter-spacing:.22em;
    color:#fff;padding-left:calc(44px + .22em);text-indent:.22em;
    background:linear-gradient(135deg,#ff7ba4 0%,#ff5c8a 45%,#ff9a6c 100%);
    box-shadow:0 16px 42px rgba(255,70,120,.42),0 2px 0 rgba(255,255,255,.16) inset,0 0 0 1px rgba(255,255,255,.12) inset;
    transition:transform .2s ease,box-shadow .3s ease,filter .3s ease;
    -webkit-animation:blowPulse 3.6s ease-in-out infinite;
    animation:blowPulse 3.6s ease-in-out infinite;
  }
  .btn-blow svg{width:18px;height:18px;flex:none;filter:drop-shadow(0 1px 3px rgba(120,20,40,.4))}
  .btn-blow::after{
    content:"";position:absolute;inset:-4px;border-radius:999px;
    border:1px solid rgba(255,160,190,.4);pointer-events:none;
    -webkit-animation:ring 3.6s ease-out infinite;animation:ring 3.6s ease-out infinite;
  }
  .btn-blow:hover{filter:brightness(1.05)}
  .btn-blow:active{transform:scale(.965)}
  .btn-blow:focus-visible{outline:2px solid rgba(255,214,230,.9);outline-offset:4px}
  @-webkit-keyframes blowPulse{0%,100%{box-shadow:0 16px 42px rgba(255,70,120,.38),0 2px 0 rgba(255,255,255,.16) inset,0 0 0 1px rgba(255,255,255,.12) inset}50%{box-shadow:0 18px 52px rgba(255,86,140,.54),0 2px 0 rgba(255,255,255,.2) inset,0 0 0 1px rgba(255,255,255,.16) inset}}
  @keyframes blowPulse{0%,100%{box-shadow:0 16px 42px rgba(255,70,120,.38),0 2px 0 rgba(255,255,255,.16) inset,0 0 0 1px rgba(255,255,255,.12) inset}50%{box-shadow:0 18px 52px rgba(255,86,140,.54),0 2px 0 rgba(255,255,255,.2) inset,0 0 0 1px rgba(255,255,255,.16) inset}}
  @-webkit-keyframes ring{0%{transform:scale(1);opacity:.55}68%{transform:scale(1.16);opacity:0}100%{transform:scale(1.16);opacity:0}}
  @keyframes ring{0%{transform:scale(1);opacity:.55}68%{transform:scale(1.16);opacity:0}100%{transform:scale(1.16);opacity:0}}
  .dock-hint{
    margin:0;font-size:11px;letter-spacing:.2em;color:rgba(255,243,238,.32);
    padding-left:.2em;
  }

  /* ---------- 吹灭后的祝福 ---------- */
  .reveal{
    position:fixed;inset:0;z-index:18;pointer-events:none;
    opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;
  }
  body.revealed .reveal{opacity:1;visibility:visible}
  .reveal-head{
    position:absolute;left:50%;top:44%;width:100%;padding:0 24px;
    transform:translate(-50%,-50%) scale(.955);
    display:flex;flex-direction:column;align-items:center;gap:11px;
    text-align:center;opacity:0;
    transition:opacity 1.1s ease .12s,transform 1.25s cubic-bezier(.2,.8,.2,1) .12s;
  }
  body.revealed .reveal-head{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .reveal-head::before{
    content:"";position:absolute;left:50%;top:50%;z-index:-1;
    width:min(124vw,760px);height:min(74vmin,540px);
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(16,4,12,.78) 0%, rgba(16,4,12,.42) 44%, rgba(10,9,16,0) 72%);
    filter:blur(3px);pointer-events:none;
  }
  .reveal-eyebrow{
    margin:0;font-size:10.5px;letter-spacing:.46em;padding-left:.46em;
    color:rgba(255,201,171,.8);text-transform:uppercase;
  }
  .reveal-title{
    margin:0;font-family:var(--font-display);font-weight:700;
    font-size:clamp(46px,13.4vw,80px);line-height:1.1;letter-spacing:.1em;
    padding-left:.1em;
    background:linear-gradient(112deg,#fff8f2 4%,#ffd9a8 32%,#ffa8c3 64%,#fff6f0 97%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 12px 38px rgba(255,90,140,.36));
  }
  .reveal-sub{
    margin:0;font-size:clamp(13px,3.6vw,16px);letter-spacing:.24em;padding-left:.24em;
    color:rgba(255,231,218,.9);font-family:var(--font-display);font-weight:400;
  }
  .reveal-days{
    margin:2px 0 0;font-size:11px;letter-spacing:.2em;color:var(--faint);padding-left:.2em;
  }
  .reveal-actions{
    position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    width:100%;max-width:340px;padding:0 24px;
    opacity:0;pointer-events:none;
    transition:opacity .8s ease .55s,transform .95s cubic-bezier(.2,.8,.2,1) .55s;
  }
  body.revealed .reveal-actions{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;
    width:100%;padding:15px 30px;border-radius:999px;border:0;
    font-family:var(--font-body);font-size:14.5px;font-weight:600;letter-spacing:.16em;
    color:#fff;cursor:pointer;text-decoration:none;
    background:linear-gradient(135deg,#ff7ba4 0%,#ff5c8a 45%,#ff9569 100%);
    box-shadow:0 14px 36px rgba(255,70,120,.42),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .22s ease,box-shadow .3s ease;
  }
  .btn-primary:active{transform:scale(.965)}
  .btn-ghost{
    display:inline-flex;align-items:center;justify-content:center;
    width:100%;padding:12px 26px;border-radius:999px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);
    color:rgba(255,243,238,.82);font-family:var(--font-body);
    font-size:13px;letter-spacing:.12em;cursor:pointer;text-decoration:none;
    transition:background .25s ease,color .25s ease;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
  .btn-primary:focus-visible,.btn-ghost:focus-visible{outline:2px solid rgba(255,214,230,.9);outline-offset:3px}

  /* ---------- 礼花闪光 ---------- */
  .flash{
    position:fixed;inset:0;z-index:17;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(255,214,170,.5) 0%, rgba(255,120,160,.18) 34%, rgba(10,9,16,0) 66%);
    mix-blend-mode:screen;
  }
  .flash.on{-webkit-animation:flashIn .95s ease-out 1;animation:flashIn .95s ease-out 1}
  @-webkit-keyframes flashIn{0%{opacity:0}14%{opacity:.85}100%{opacity:0}}
  @keyframes flashIn{0%{opacity:0}14%{opacity:.85}100%{opacity:0}}

  /* ---------- 降级 ---------- */
  .fallback{
    position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
    background:rgba(8,7,12,.8);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .fallback[hidden]{display:none}
  .fb-card{
    width:min(100%,390px);padding:30px 26px 24px;border-radius:26px;text-align:center;
    background:rgba(20,8,16,.86);border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,107,154,.12);
  }
  .fb-emoji{font-size:44px;line-height:1;margin-bottom:12px;filter:grayscale(.15)}
  .fb-title{margin:0 0 10px;font-family:var(--font-display);font-size:22px;letter-spacing:.08em;color:#ffe9dd}
  .fb-text{margin:0 0 20px;font-size:12.5px;line-height:1.8;color:var(--muted);letter-spacing:.04em}
  .fb-actions{display:flex;flex-direction:column;gap:10px}

  /* ---------- 桌面 ---------- */
  @media (min-width:900px){
    .top{top:calc(30px + env(safe-area-inset-top))}
    .eyebrow{font-size:11.5px}
    .top-sub{font-size:11.5px;margin-top:10px}
    .drag-hint{
      top:calc(104px + env(safe-area-inset-top));bottom:auto;
      font-size:11.5px;
    }
    .dock{bottom:calc(32px + env(safe-area-inset-bottom))}
    .btn-blow{font-size:16px;padding:17px 48px;padding-left:calc(48px + .22em)}
    .reveal-head{top:42%}
    .reveal-actions{
      flex-direction:row;justify-content:center;gap:14px;
      max-width:none;width:auto;padding:0;bottom:calc(42px + env(safe-area-inset-bottom));
    }
    .btn-primary,.btn-ghost{width:auto}
    .btn-primary{padding:16px 38px}
    .btn-ghost{padding:16px 30px;font-size:13.5px}
  }
  @media (min-width:1200px){
    .reveal-title{font-size:clamp(64px,6.4vw,92px)}
  }
  @media (max-height:520px){
    .eyebrow,.top-sub{display:none}
    .top{top:0}
    .drag-hint{display:none}
    .dock{bottom:calc(16px + env(safe-area-inset-bottom))}
    .btn-blow{padding:12px 34px;padding-left:calc(34px + .22em);font-size:14px}
    .reveal-head{top:40%;gap:8px}
    .reveal-title{font-size:clamp(34px,7vw,56px)}
    .reveal-actions{bottom:calc(16px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion: reduce){
    .glow{animation:none}
    .btn-blow,.btn-blow::after{animation:none}
    .top,.reveal,.reveal-head,.reveal-actions{transition-duration:.01s !important;transition-delay:0s !important}
    .flash.on{animation-duration:.01s}
  }
</style>
<link rel="stylesheet" href="css/lock.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>
    <div class="glow glow-d"></div>
  </div>

  <canvas id="scene" aria-label="三层生日蛋糕，可以拖动旋转"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <header class="top">
    <p class="eyebrow">ONE YEAR WITH YOU</p>
    <p class="top-sub" id="topSub">2025.11.03 — 2026.11.03</p>
  </header>

  <div class="drag-hint" id="dragHint">轻轻拖动 · 转个圈看看</div>

  <footer class="dock" id="dock">
    <button class="btn-blow" id="blowBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.7c2.6 3.9 5.9 6.3 5.9 10.2A5.9 5.9 0 0 1 6.1 11.9c0-2.3 1.3-4 2.7-5.5.2 1.5 1.1 2.6 2.2 3 .1-2.7.4-5.6 1-7.7Z"/><path fill="currentColor" opacity=".55" d="M12.1 10.6c1.4 1.9 3 3.1 3 5.2a3 3 0 0 1-6 0c0-1.2.6-2.1 1.4-2.9.1.8.5 1.4 1.1 1.7.1-1.4.2-2.7.5-4Z"/></svg>
      吹蜡烛
    </button>
    <p class="dock-hint">许个愿，然后吹灭它</p>
  </footer>

  <section class="reveal" id="reveal" aria-hidden="true">
    <div class="reveal-head">
      <p class="reveal-eyebrow">HAPPY 1ST ANNIVERSARY</p>
      <h1 class="reveal-title" id="revealTitle">一周年快乐</h1>
      <p class="reveal-sub" id="revealSub">宝宝 · 一周年</p>
      <p class="reveal-days" id="revealDays">一起走过 365 天</p>
    </div>
    <div class="reveal-actions">
      <a class="btn-primary" id="storyBtn" href="story.html">打开我们的故事</a>
      <a class="btn-ghost" id="backBtn" href="index.html">回到爱心</a>
    </div>
  </section>

  <div class="fallback" id="fallback" hidden>
    <div class="fb-card">
      <div class="fb-emoji">🎂</div>
      <h2 class="fb-title" id="fbTitle">3D 蛋糕没能画出来</h2>
      <p class="fb-text" id="fbText">这台设备暂时没能启用 WebGL（3D 加速）。换最新版 Chrome / Edge，或者点下面的按钮直接看祝福。</p>
      <div class="fb-actions">
        <button class="btn-primary" id="fbBless" type="button">直接看祝福</button>
        <button class="btn-ghost" id="fbRetry" type="button">再试一次</button>
      </div>
    </div>
  </div>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;color:#fff3ee;font-size:14px">请打开 JavaScript 再来看蛋糕 :)</p></noscript>

  <script src="vendor/three/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/cake.js"></script>
</body>
</html>
