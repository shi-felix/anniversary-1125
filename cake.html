<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0409">
<title>一周年快乐 · 蛋糕</title>
<link rel="stylesheet" href="css/cake.css">
<link rel="stylesheet" href="css/lock.css">
<script src="js/transition.js"></script>
</head>
<body>
<canvas id="scene" aria-label="三层生日蛋糕，可以拖动旋转"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="eyebrow">ONE YEAR WITH YOU</div>
  <h1>一周年快乐</h1>
  <div class="sub"><span id="topRange">2025.11.25 — 今天</span> · <span id="topDays">我们的第 350 天</span></div>
</header>

<div class="hint" id="hint">拖动转个圈 · 点一下蜡烛吹灭它</div>

<div class="bar">
  <button id="btnBlow" class="btn" type="button">吹蜡烛</button>
  <button id="btnMic" class="btn ghost" type="button">用麦克风吹</button>
  <span class="micState" id="micState"></span>
</div>

<div class="finale" id="finale">
  <div class="finale-inner">
    <div class="eyebrow">HAPPY</div>
    <div class="big">我们的第一年</div>
    <div class="finale-cta">
      <a class="btn" id="storyBtn" href="story.html">打开我们的故事</a>
      <a class="btn ghost" id="backBtn" href="index.html">回到爱心</a>
    </div>
  </div>
</div>

<script src="vendor/three/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/lock.js"></script>
<script>
(function () {
  var g = window.GIFT || {};
  var raw = g.togetherDate || '2025-11-25';
  var start = new Date(raw.length > 10 ? raw : raw + 'T00:00:00');
  if (isNaN(start.getTime())) start = new Date('2025-11-25T00:00:00');
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.floor((today - start) / 86400000) + 1;
  function fmt(d) {
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }
  var r = document.getElementById('topRange');
  var n = document.getElementById('topDays');
  if (r) r.textContent = fmt(start) + ' — ' + fmt(now);
  if (n) n.textContent = '我们的第 ' + days + ' 天';
})();
</script>
<script src="js/cake.js"></script>
</body>
</html>
